name: Release

# Publishing = pushing a `v*` tag (`make release` does that from Info.plist's version).
# Builds the universal binary with the same Makefile path `make install` uses, checks the
# tag against the plist and the binary's own --version, and attaches the zip to a GitHub
# release with generated notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build universal · publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Swift toolchain
        run: swift --version

      - name: Tag matches Info.plist
        run: |
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Info.plist says $v"; exit 1; }

      - name: Unit tests
        run: make test

      - name: Build universal binary + zip
        run: make dist

      - name: Smoke-test the artifact
        run: |
          lipo -info .build/dist/blescan
          codesign -dv .build/dist/blescan
          out="$(.build/dist/blescan --version)"
          [ "$out" = "blescan ${GITHUB_REF_NAME#v}" ] || { echo "--version printed '$out'"; exit 1; }
          unzip -l .build/dist/*.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .build/dist/*.zip \
            --title "blescan $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes

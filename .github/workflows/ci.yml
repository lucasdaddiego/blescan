name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: build · test · 100% coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Swift toolchain
        run: swift --version

      # Compiles the whole app — Core.swift plus main.swift and its CoreBluetooth
      # links — so a break in the framework-facing code fails CI too.
      - name: Build (SwiftPM, debug)
        run: swift build

      # The shipped binary is NOT the SwiftPM one: `make build` is the release path —
      # -O, symbol strip, -dead_strip, the Info.plist embedded via -sectcreate, then an
      # ad-hoc codesign. Until this ran here, a linker-flag or plist regression only
      # surfaced on a developer's `make install`.
      - name: Build (release, Makefile)
        run: make build

      # Fast, uninstrumented run of the dependency-free core unit tests.
      - name: Unit tests
        run: make test

      # Re-runs the tests under llvm-cov instrumentation and fails unless Core.swift
      # is at 100% region + line coverage (scripts/check-coverage.sh).
      - name: Coverage gate (Core.swift = 100%)
        run: make coverage
